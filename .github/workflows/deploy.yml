name: Deploy to Namecheap

# Runs on every push to main (except docs-only pushes), or by hand from the
# Actions tab / `gh workflow run "Deploy to Namecheap"` (scripts/deploy.sh).

on:
  push:
    branches: [main]
    # Docs-only pushes (README/DESIGN/LOG/MISTAKES) don't change the build.
    paths-ignore:
      - "**.md"
  workflow_dispatch:

# Never run two uploads to the same folder at once; a newer push waits for
# the running deploy instead of cancelling it mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Upload dist/ over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          # Relative to the FTP account's own root, which is scoped to
          # public_html/beamlab — so ./, not the full path.
          server-dir: ./
